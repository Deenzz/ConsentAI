<style>

body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:2px solid var(--pri);outline-offset:2px}

.logo{width:36px;height:36px;border-radius:10px;background:var(--priT);color:var(--pri);display:grid;place-items:center;font-size:19px}

#side .nv.on{background:var(--priT);color:var(--pri)}#side .nv span{width:22px;text-align:center}

.card h2{font-size:15.5px;margin:0 0 8px}.card h3{font-size:13.5px;margin:13px 0 5px;color:var(--pri)}
.sub{color:var(--mut);font-size:12.5px}
.btn{border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:10px 14px;font-weight:700;font-size:13.5px}.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}[data-theme="dark"] .btn.p{color:#06201d}.btn.s{padding:6px 10px;font-size:12px}.btn:disabled{opacity:.45}

.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px}

.item{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:11px 12px;margin:7px 0;cursor:pointer}.item b{font-size:14px}
ul.l{margin:4px 0 4px 18px;padding:0}ul.l li{margin:3px 0;font-size:13.5px}

.band{border:1px solid var(--line);border-radius:10px;margin:6px 0;overflow:hidden}.band h4{margin:0;padding:6px 10px;font-size:12.5px}.band ul{margin:0;padding:6px 10px 6px 28px;font-size:13.5px}
.b1 h4{background:var(--bluT);color:var(--blu)}.b2 h4{background:var(--ambT);color:var(--amb)}.b3 h4{background:var(--redT);color:var(--red)}
.paper{background:#fff;color:#111;border:1px solid var(--line);border-radius:6px;padding:18px;font-family:Georgia,"Times New Roman",serif;font-size:13.5px;line-height:1.55}
.paper h1{font-size:17px;text-align:center;margin:0 0 2px;font-family:inherit}.paper h2{font-size:14px;border-bottom:1px solid #999;margin:14px 0 4px;font-family:inherit}.paper p{margin:3px 0}.paper li{margin:2px 0}.paper .sm{font-size:11.5px;color:#444}
.sig{border:1px dashed var(--line);border-radius:10px;background:#fff;touch-action:none;width:100%;height:100px;display:block}
.msg{padding:10px 12px;border-radius:12px;margin:8px 0;font-size:14px;white-space:pre-wrap}.msg.u{background:var(--priT);margin-left:24px}.msg.a{background:var(--card2);border:1px solid var(--line)}
.out{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13.5px;min-height:44px}
details{border:1px solid var(--line);border-radius:10px;padding:8px 11px;margin:6px 0;background:var(--card2)}summary{cursor:pointer;font-weight:700;font-size:13.5px}
.hide{display:none!important}#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80}
@media(min-width:960px){#side{transform:none}#scrim{display:none!important}#top,#main{margin-left:250px}#main{max-width:760px;margin-left:calc(250px + (100vw - 250px - 760px)/2)}#menu{display:none}}
@media print{#side,#top,.no-print{display:none!important}body{background:#fff}#main{margin:0;max-width:none}}
</style>

 how:["The doctor first checks the ear with a light. Warm water is flushed gently with a syringe. Tell us at once if you feel pain or dizziness.","Doktor memeriksa telinga dengan lampu. Air suam disiram perlahan dengan picagari. Beritahu serta-merta jika terasa sakit atau pening."],

{id:"suture",tier:2,t:["Wound cleaning and stitching (suturing)","Pembersihan luka dan jahitan"],site:"site of wound",sp:["dm","anticoag","imm","keloid","pvd"],
 pur:["The wound is cleaned and numbed, dirt is removed, and the edges are closed with stitches, glue or tape to help healing.","Luka dibersihkan dan dibius, kotoran dibuang dan tepi luka dirapatkan dengan jahitan, gam atau pita supaya sembuh."],
 ben:["Stops bleeding, lowers infection risk and gives a neater scar.","Menghentikan pendarahan, mengurangkan risiko jangkitan dan parut lebih kemas."],
 alt:["Wound-closure strips, tissue glue, or healing without stitches (slower, wider scar); referral to a hospital for deep or complex wounds.","Pita penutup luka, gam tisu, atau sembuh tanpa jahitan (lebih lambat, parut lebih lebar); rujukan ke hospital untuk luka dalam atau rumit."],
 c:[["Stinging while the local anaesthetic goes in","Pedih semasa ubat bius setempat disuntik"],["Pain, swelling and bruising afterwards","Sakit, bengkak dan lebam selepas itu"],["A permanent scar (may be raised or widened)","Parut kekal (mungkin timbul atau melebar)"]],
 u:[["Wound infection needing antibiotics or stitch removal","Jangkitan luka memerlukan antibiotik atau jahitan dibuka"],["Wound opening up (dehiscence)","Luka terbuka semula"],["Allergy to local anaesthetic, plaster or antiseptic","Alahan kepada ubat bius setempat, plaster atau antiseptik"]],
 r:[["Retained foreign body (glass, wood, grit) not seen at first","Benda asing tertinggal (kaca, kayu, pasir) yang tidak kelihatan pada mulanya"],["Injury to a tendon, nerve or blood vessel that was already there and is found later","Kecederaan tendon, saraf atau salur darah yang sedia ada dan dikesan kemudian"],["Tetanus if not protected (we will check your vaccination)","Tetanus jika tidak dilindungi (kami akan menyemak suntikan anda)"],["Serious reaction to local anaesthetic","Reaksi serius terhadap ubat bius setempat"]],
 how:["The wound is washed, local anaesthetic is injected, and the wound is explored and closed. A dressing is applied and a tetanus booster may be given.","Luka dibasuh, ubat bius setempat disuntik, luka diperiksa dan dijahit. Pembalut dipasang dan suntikan tetanus mungkin diberi."],
 after:[["Keep dry and covered as advised. Return for stitch removal on the date given.","Pastikan kering dan berbalut mengikut nasihat. Datang semula untuk buka jahitan pada tarikh diberi."]],
 flag:[["Spreading redness, pus, increasing pain, or fever","Merah merebak, bernanah, sakit bertambah, atau demam"],["Wound opens, numbness, or you cannot move a finger or toe normally","Luka terbuka, kebas, atau jari tidak dapat digerakkan seperti biasa"]],
 chk:["Tetanus status; check wound depth, tendon, nerve and vascular function before anaesthetic","X-ray if glass or metal suspected","Allergy to local anaesthetic","Bite, contaminated or old wound: consider not closing","Diabetes, immunosuppression, peripheral vascular disease"]},
{id:"foley",tier:2,t:["Urinary catheter insertion (Foley)","Pemasangan kateter urin (Foley)"],site:"urethra",sp:["imm","dm"],
 pur:["A thin soft tube is passed through the urethra into the bladder to drain urine.","Tiub nipis lembut dimasukkan melalui uretra ke dalam pundi kencing untuk mengalirkan air kencing."],
 ben:["Relieves a blocked bladder, allows monitoring of urine, or keeps you dry when you cannot pass urine.","Melegakan pundi kencing tersumbat, membolehkan pemantauan air kencing, atau memastikan anda kering apabila tidak dapat kencing."],
 alt:["Intermittent self-catheterisation, a catheter placed through the abdomen (suprapubic), or specialist care.","Kateterisasi kendiri berselang, kateter melalui perut (suprapubik), atau rawatan pakar."],
 c:[["Discomfort or burning on insertion","Rasa tidak selesa atau pedih semasa dimasukkan"],["Blood in the urine for a short time","Darah dalam air kencing seketika"],["Bladder spasm and urge to pass urine","Kejang pundi kencing dan rasa hendak kencing"]],
 u:[["Urine infection","Jangkitan saluran kencing"],["Failed insertion needing a specialist","Pemasangan gagal dan memerlukan pakar"]],
 r:[["Injury to the urethra or false passage, which can cause later narrowing (stricture)","Kecederaan uretra atau laluan palsu yang boleh menyebabkan penyempitan (striktur)"],["Foreskin trapped behind the head of the penis (paraphimosis) if not replaced","Kulup tersepit di belakang kepala zakar (parafimosis) jika tidak dikembalikan"],["Blood infection (sepsis)","Jangkitan darah (sepsis)"],["Bladder injury (very rare)","Kecederaan pundi kencing (sangat jarang)"]],
 how:["Using a sterile technique and anaesthetic gel, the catheter is passed into the bladder and the balloon is inflated. It is secured to the leg.","Dengan teknik steril dan gel bius, kateter dimasukkan ke pundi kencing dan belon dikembungkan. Ia dilekatkan pada kaki."],
 after:[["Drink plenty of fluids unless told otherwise. Keep the bag below bladder level.","Minum banyak air kecuali dinasihatkan lain. Letakkan beg lebih rendah daripada pundi kencing."]],
 flag:[["No urine draining, severe pain, or a lot of blood","Tiada air kencing mengalir, sakit teruk, atau banyak darah"],["Fever, shivering or confusion","Demam, menggigil atau keliru"]],
 chk:["Clear indication; chaperone offered","Recent pelvic or urethral surgery or trauma (blood at meatus)","Latex or lubricant allergy","Prostate problems","Clinical need for catheter reviewed daily"]},
{id:"pap",tier:2,t:["Pap smear / vaginal speculum examination","Ujian Pap smear / pemeriksaan spekulum faraj"],site:"cervix",sp:["pregn"],
 pur:["A speculum is placed in the vagina to see the cervix and collect cells to screen for cervical cancer or to check for other problems.","Spekulum dimasukkan ke dalam faraj untuk melihat serviks dan mengambil sel bagi saringan kanser serviks atau memeriksa masalah lain."],
 ben:["Early detection of cell changes before cancer develops.","Pengesanan awal perubahan sel sebelum menjadi kanser."],
 alt:["HPV DNA self-sampling or HPV testing where available; or not screening.","Pensampelan sendiri HPV DNA atau ujian HPV jika ada; atau tidak menjalani saringan."],
 c:[["Discomfort, pressure or mild cramps","Rasa tidak selesa, tekanan atau kejang ringan"],["Light spotting afterwards","Sedikit tompokan darah selepas itu"]],
 u:[["Inadequate sample needing a repeat test","Sampel tidak mencukupi dan perlu diulang"],["Anxiety or embarrassment","Rasa cemas atau malu"]],
 r:[["A normal result does not exclude disease (false negative)","Keputusan normal tidak menolak penyakit (negatif palsu)"],["Infection or injury to the cervix (rare)","Jangkitan atau kecederaan serviks (jarang)"]],
 how:["You lie on the couch with a sheet. A chaperone is offered. You can ask to stop at any time.","Anda berbaring di atas katil dengan kain tutup. Pengiring (chaperone) ditawarkan. Anda boleh meminta berhenti pada bila-bila masa."],
 after:[["Light spotting is normal. Results are available in about 2 to 4 weeks.","Tompokan darah ringan adalah normal. Keputusan biasanya didapati dalam 2 hingga 4 minggu."]],
 flag:[["Heavy bleeding, severe pain or foul discharge or fever","Pendarahan banyak, sakit teruk, lelehan berbau atau demam"]],
 chk:["Chaperone offered and recorded","Pregnancy; last menstrual period","Previous abnormal smear","Cultural or religious preferences"]},
{id:"incdr",tier:3,t:["Incision and drainage of abscess / boil","Belah dan buang nanah (abses / bisul)"],site:"site",sp:["dm","anticoag","imm","keloid","pvd"],
 pur:["A small cut is made to let pus out of an abscess, which relieves pain and helps the infection clear.","Satu hirisan kecil dibuat untuk mengeluarkan nanah daripada abses, melegakan sakit dan membantu jangkitan sembuh."],
 ben:["Pain relief and the best chance of clearing the infection.","Melegakan sakit dan peluang terbaik untuk menyembuhkan jangkitan."],
 alt:["Antibiotics alone (often not enough), warm compress, needle aspiration, or hospital referral for deep or facial abscesses.","Antibiotik sahaja (selalunya tidak mencukupi), tuaman suam, sedutan jarum, atau rujukan hospital untuk abses dalam atau di muka."],
 c:[["Pain while the anaesthetic is working (it may not numb inflamed tissue well)","Sakit semasa ubat bius berkesan (mungkin kurang berkesan pada tisu meradang)"],["Bleeding and pus discharge for 2 to 3 days","Pendarahan dan lelehan nanah selama 2 hingga 3 hari"],["Painful dressing changes or packing","Pertukaran pembalut atau sumbatan yang menyakitkan"],["A scar","Parut"]],
 u:[["Abscess comes back (recurrence), needing another procedure","Abses berulang, memerlukan prosedur lagi"],["Spreading skin infection (cellulitis)","Jangkitan kulit merebak (selulitis)"]],
 r:[["Chronic draining channel (fistula) needing surgery","Saluran bernanah kronik (fistula) yang memerlukan pembedahan"],["Blood poisoning (sepsis)","Keracunan darah (sepsis)"],["Injury to a nearby nerve causing numbness","Kecederaan saraf berhampiran menyebabkan kebas"]],
 how:["The area is cleaned, numbed, opened and the pus drained. The cavity may be packed with gauze. Dressing changes follow.","Kawasan dibersihkan, dibius, dibuka dan nanah dikeluarkan. Rongga mungkin disumbat kain kasa. Pembalut ditukar selepas itu."],
 after:[["Keep the dressing clean; return for dressing changes as advised.","Pastikan pembalut bersih; datang semula untuk pertukaran pembalut."]],
 flag:[["Spreading redness, fever, severe pain, or red streaks","Merah merebak, demam, sakit teruk, atau jalur merah"],["Pus builds up again","Nanah terkumpul semula"]],
 chk:["Fluctuant collection confirmed; not in a danger area (face, hand, perianal, breast)","Diabetes, immunosuppression","Allergy to local anaesthetic","Wound swab if recurrent (MRSA)"]},
{id:"excise",tier:3,t:["Excision of skin lump (cyst, lipoma, mole, skin tag)","Pembuangan ketumbuhan kulit (sista, lipoma, tahi lalat, ketuat)"],site:"site",sp:["dm","anticoag","imm","keloid","pvd"],
 pur:["The lump is cut out under local anaesthetic to treat discomfort, repeated infection, or appearance, and may be sent to the laboratory to look at the tissue (histology).","Ketumbuhan dibuang di bawah ubat bius setempat untuk merawat rasa tidak selesa, jangkitan berulang atau penampilan, dan mungkin dihantar ke makmal untuk pemeriksaan tisu (histologi)."],
 ben:["Removes the lump and tells us exactly what it is.","Membuang ketumbuhan dan mengetahui dengan tepat apa ia."],
 alt:["Leave it alone and watch; cryotherapy, cautery or creams for some skin lesions; referral to a surgeon or dermatologist.","Biarkan dan pantau; krioterapi, kauteri atau krim untuk sesetengah lesi kulit; rujukan kepada pakar bedah atau dermatologi."],
 c:[["Stinging from the local anaesthetic","Pedih daripada ubat bius setempat"],["Pain, bruising and swelling","Sakit, lebam dan bengkak"],["A permanent scar, sometimes raised or wide (keloid)","Parut kekal, kadangkala timbul atau lebar (keloid)"]],
 u:[["Wound infection","Jangkitan luka"],["Wound opening up or slow healing","Luka terbuka atau lambat sembuh"],["Lump comes back (recurrence), especially cysts","Ketumbuhan berulang, terutamanya sista"]],
 r:[["The laboratory finds something more serious, such as skin cancer, needing more surgery","Makmal menemui sesuatu yang lebih serius, seperti kanser kulit, yang memerlukan pembedahan lanjut"],["Numbness from a small nerve being cut","Kebas kerana saraf kecil terpotong"],["Heavy bleeding needing hospital care","Pendarahan banyak yang memerlukan rawatan hospital"],["Serious reaction to local anaesthetic","Reaksi serius terhadap ubat bius setempat"]],
 how:["The skin is cleaned and numbed, the lump is removed and the wound is stitched. The sample may be sent for histology.","Kulit dibersihkan dan dibius, ketumbuhan dibuang dan luka dijahit. Sampel mungkin dihantar untuk histologi."],
 after:[["Keep the wound dry and covered; stitches are removed in about 7 to 14 days. We will tell you about the laboratory result.","Pastikan luka kering dan berbalut; jahitan dibuka dalam 7 hingga 14 hari. Kami akan memaklumkan keputusan makmal."]],
 flag:[["Spreading redness, pus, fever, or increasing pain","Merah merebak, bernanah, demam atau sakit bertambah"],["Bleeding that does not stop with pressure for 15 minutes","Pendarahan yang tidak berhenti selepas ditekan 15 minit"]],
 chk:["Pigmented or changing mole: dermoscopy; consider referral instead","Lump over 5 cm, deep, or near a major nerve or vessel: refer","Keloid tendency","Anticoagulants; allergy to local anaesthetic","Separate consent for sending tissue to the lab or for photos (MMC 3.18)"]},
{id:"nail",tier:3,t:["Ingrown toenail surgery (partial nail removal)","Pembedahan kuku kaki tumbuh ke dalam (pembuangan separa kuku)"],site:"toe (R/L)",sp:["dm","pvd","anticoag","imm"],
 pur:["Part of the nail edge is removed under local anaesthetic, sometimes with a chemical (phenol) to stop that edge growing back.","Sebahagian tepi kuku dibuang di bawah ubat bius setempat, kadangkala dengan bahan kimia (fenol) untuk menghentikan tepi itu tumbuh semula."],
 ben:["Relieves pain and infection and lowers the chance of it returning.","Melegakan sakit dan jangkitan serta mengurangkan peluang ia berulang."],
 alt:["Cotton or gutter splints, antibiotics and soaks, removing the whole nail, or referral to a podiatrist or surgeon.","Penyokong kapas atau splint, antibiotik dan rendaman, membuang seluruh kuku, atau rujukan kepada podiatris atau pakar bedah."],
 c:[["Pain from the toe block injection","Sakit daripada suntikan bius pada jari kaki"],["Throbbing, discharge and swelling for several days","Berdenyut, lelehan dan bengkak beberapa hari"],["Dressing changes","Pertukaran pembalut"]],
 u:[["Nail edge grows back (recurrence), more likely without phenol","Tepi kuku tumbuh semula, lebih mungkin tanpa fenol"],["Infection","Jangkitan"],["Slow healing; narrower or odd-shaped nail","Penyembuhan lambat; kuku lebih sempit atau bentuk berbeza"]],
 r:[["Chemical burn to nearby skin from phenol","Kulit berhampiran terbakar kimia akibat fenol"],["Poor healing or gangrene in people with diabetes or poor circulation","Penyembuhan lemah atau gangren pada pesakit diabetes atau peredaran darah lemah"],["Lasting numbness or sensitivity of the toe","Kebas atau sensitif yang kekal pada jari kaki"],["Bone infection (osteomyelitis)","Jangkitan tulang (osteomielitis)"]],
 how:["The toe is numbed with an injection, a tourniquet may be used, the nail edge is cut away and phenol applied, then bandaged.","Jari kaki dibius dengan suntikan, tali pengikat mungkin digunakan, tepi kuku dipotong dan fenol disapu, kemudian dibalut."],
 after:[["Keep the foot raised and the dressing dry for 24 hours. Soaks and dressings as advised for 2 to 4 weeks.","Naikkan kaki dan pastikan pembalut kering selama 24 jam. Rendaman dan pembalut seperti dinasihatkan selama 2 hingga 4 minggu."]],
 flag:[["Toe turns blue, black or cold; spreading redness; fever","Jari kaki jadi biru, hitam atau sejuk; merah merebak; demam"]],
 chk:["Pulses and sensation; diabetes control","Peripheral arterial disease: refer instead","Allergy to local anaesthetic (no adrenaline in toe blocks)","Phenol precautions; pregnancy"]},
{id:"jinj",tier:3,t:["Steroid injection into a joint or soft tissue","Suntikan steroid ke sendi atau tisu lembut"],site:"joint / tendon (R/L)",sp:["dm","anticoag","imm"],
 pur:["A steroid with or without local anaesthetic is injected near a painful joint, tendon or bursa to reduce inflammation and pain.","Steroid dengan atau tanpa ubat bius setempat disuntik berhampiran sendi, tendon atau bursa yang sakit untuk mengurangkan keradangan dan sakit."],
 ben:["Often reduces pain for weeks to months, allowing exercise and physiotherapy.","Sering mengurangkan sakit selama beberapa minggu hingga bulan, membolehkan senaman dan fisioterapi."],
 alt:["Rest, physiotherapy, painkillers, splints, oral or topical anti-inflammatory medicines, or surgery.","Rehat, fisioterapi, ubat tahan sakit, splint, ubat antiradang oral atau topikal, atau pembedahan."],
 c:[["Pain flare for 1 to 2 days after the injection","Sakit bertambah selama 1 hingga 2 hari selepas suntikan"],["Bruising","Lebam"],["Facial flushing; higher blood sugar for several days in people with diabetes","Muka merah; gula darah lebih tinggi beberapa hari pada pesakit diabetes"]],
 u:[["Pale or thin skin or loss of fat at the site","Kulit pucat atau nipis atau kehilangan lemak pada tempat suntikan"],["No benefit or short-lived benefit","Tiada manfaat atau manfaat sebentar sahaja"],["Irregular periods or fluid retention","Haid tidak teratur atau badan bengkak"]],
 r:[["Tendon weakening or rupture","Tendon menjadi lemah atau putus"],["Joint infection (septic arthritis)","Jangkitan sendi (artritis septik)"],["Nerve injury","Kecederaan saraf"],["Severe allergy","Alahan teruk"]],
 how:["The skin is cleaned and the steroid injected. The injection may be guided by landmarks or ultrasound. Rest the joint for 24 to 48 hours.","Kulit dibersihkan dan steroid disuntik. Suntikan boleh dipandu menggunakan penanda atau ultrabunyi. Rehatkan sendi 24 hingga 48 jam."],
 after:[["Avoid heavy use for 1 to 2 days. Check blood sugar more often if diabetic.","Elakkan penggunaan berat 1 hingga 2 hari. Semak gula darah lebih kerap jika diabetes."]],
 flag:[["Hot, red, swollen joint, severe pain, or fever (possible infection)","Sendi panas, merah, bengkak, sakit teruk atau demam (mungkin jangkitan)"],["Sudden loss of tendon strength","Kelemahan tendon secara tiba-tiba"]],
 chk:["Exclude infection (no fever, skin intact)","Previous steroid injections here (limit repeats)","Diabetes and blood sugar","Anticoagulant control","Allergy to steroid or local anaesthetic; prosthetic joint: do not inject in clinic"]},
{id:"cryo",tier:3,t:["Cryotherapy (liquid nitrogen) for warts or skin lesions","Krioterapi (nitrogen cecair) untuk ketuat atau lesi kulit"],site:"site",sp:["dm","pvd","imm"],
 pur:["A very cold liquid is applied to freeze and destroy a wart, skin tag or other benign lesion.","Cecair sangat sejuk disapu untuk membekukan dan memusnahkan ketuat atau lesi jinak lain."],
 ben:["Removes the lesion without cutting.","Membuang lesi tanpa pembedahan."],
 alt:["Creams (salicylic acid), watching and waiting, minor surgery, or laser/electrocautery.","Krim (asid salisilik), memerhati dan menunggu, pembedahan kecil, atau laser/elektrokauteri."],
 c:[["Pain or stinging during and after freezing","Sakit atau pedih semasa dan selepas pembekuan"],["Redness, swelling and a blister","Merah, bengkak dan lepuh"],["More than one treatment is often needed","Selalunya memerlukan lebih daripada satu rawatan"]],
 u:[["Lighter or darker skin at the site","Kulit lebih cerah atau lebih gelap pada tempat itu"],["Scarring","Parut"],["Infection of the blister","Jangkitan pada lepuh"]],
 r:[["Nerve damage with numbness, especially on fingers","Kerosakan saraf dengan kebas, terutamanya pada jari"],["Nail damage or growth defects","Kerosakan kuku atau kecacatan pertumbuhan"],["Treating a lesion that was actually a skin cancer and delaying diagnosis","Merawat lesi yang sebenarnya kanser kulit sehingga menangguhkan diagnosis"]],

 after:[["A blister may form; do not burst it. Keep it clean.","Lepuh mungkin terbentuk; jangan pecahkan. Pastikan bersih."]],
 flag:[["Pus, spreading redness, fever","Nanah, merah merebak, demam"],["A lesion that is bleeding, growing or changing colour","Lesi yang berdarah, membesar atau berubah warna"]],
 chk:["Diagnosis clear (not a suspicious pigmented lesion)","Poor circulation or Raynaud's","Cold urticaria","Pregnancy (relative caution)"]},

 ben:["Highly effective, long-acting and reversible contraception.","Kontraseptif sangat berkesan, tahan lama dan boleh dipulihkan."],
 alt:["Pills, injections, implants, condoms, sterilisation, or no contraception.","Pil, suntikan, implan, kondom, pensterilan, atau tiada kontraseptif."],
 c:[["Cramping pain or discomfort during and after insertion","Kejang dan rasa tidak selesa semasa dan selepas pemasangan"],["Changes in bleeding: spotting, heavier or longer periods (copper) or lighter or none (hormonal)","Perubahan haid: tompokan, haid lebih banyak atau lama (kuprum) atau lebih sedikit atau tiada (hormon)"],["Fainting","Pitam"]],
 u:[["The device comes out by itself (expulsion), especially in the first year","Alat keluar sendiri (ekspulsi), terutamanya dalam tahun pertama"],["Pelvic infection in the first weeks","Jangkitan pelvis dalam beberapa minggu pertama"],["Strings cannot be felt or are uncomfortable","Tali tidak dapat dirasa atau tidak selesa"]],

 c:[["Pain, swelling and bruising for several days","Sakit, bengkak dan lebam beberapa hari"],["Minor bleeding or oozing","Pendarahan atau lelehan kecil"],["Discomfort when passing urine at first","Rasa tidak selesa semasa kencing pada mulanya"]],
